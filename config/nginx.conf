//--- Need change to your own configs BEGIN: ---// 
upstream puma { 
	server unix:///u/apps/wescomphotos/shared/tmp/sockets/wescomphotos-puma.sock; 
}

server { 
	listen 80 default_server; 
	listen [::]:80 default_server; 
	server_name wescomphotos.wescompapers.com;

 root /u/apps/wescomphotos/current/public; 
//--- Need change to your own configs END: ---//

 location ^~ /assets/ { 
	gzip_static on; 
	expires max; 
	add_header Cache-Control public; 
	}

 try_files $uri/index.html $uri @puma; 
 location @puma { 
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; 
	proxy_set_header Host $http_host; 
	proxy_redirect off;

 	proxy_pass http://puma; 
 }

	error_page 500 502 503 504 /500.html; 
	client_max_body_size 10M; 
	keepalive_timeout 10; }