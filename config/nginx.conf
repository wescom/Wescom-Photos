upstream puma { 
	server unix:///u/apps/wescomphotos/shared/tmp/sockets/wescomphotos-puma.sock; 
}

# for redirecting to https version of the site
server {
       listen 80;
       rewrite ^(.*) https://$host$1 permanent;
 }
 
# for redirecting to root version of the site
server {
    listen  80;
    server_name  wescomphotos.com;
    rewrite ^(.*) https://bulletin.wescomphotos.com$1 permanent;
}

# for redirecting to non-www version of the site
server {
    listen  80;
    server_name  www.wescomphotos.com;
    rewrite ^(.*) https://bulletin.wescomphotos.com$1 permanent;
}

server {  
	listen 443 ssl;
	root /u/apps/wescomphotos/current/public;

	ssl_certificate /etc/nginx/ssl/bulletin_wescomphotos_com.crt;
	ssl_certificate_key /etc/nginx/ssl/bulletin_wescomphotos_com.key;
	
	server_name bulletin.wescomphotos.com;

	location ^~ /assets/ { 
		gzip_static on; 
		expires max; 
		add_header Cache-Control public; 
	}

	try_files $uri/index.html $uri @puma; 
	location @puma { 
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; 
		proxy_set_header Host $http_host; 
		proxy_redirect off;

		proxy_pass http://puma; 
	}

	error_page 500 502 503 504 /500.html; 
	client_max_body_size 10M; 
	keepalive_timeout 10; 
}